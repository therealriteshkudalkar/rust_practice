[package]
name = "rust_practice"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The interactive src/main.rs runner was removed, so the package now builds a
# small library target instead. All test files under tests/ are discovered
# automatically by Cargo and can run independently.
[lib]
name = "rust_practice"
path = "src/lib.rs"

